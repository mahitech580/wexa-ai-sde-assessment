name: Wexa assessment CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: wexa-assessment-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q app.py auth.py db.py models.py schemas.py
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Validate Postman JSON and Render YAML
        run: |
          python -c "import json; json.load(open('postman_collection.json', encoding='utf-8'))"
          python -c "import yaml; yaml.safe_load(open('render.yaml', encoding='utf-8'))"
      - name: Run automated tests
        run: pytest -q

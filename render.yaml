services:
  - type: web
    name: wexa-ai-sde-assessment
    runtime: python
    plan: free
    region: singapore
    buildCommand: python -m pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: STOCKFLOW_API_MODE
        value: supabase
      - key: SUPABASE_API_ORIGIN
        value: https://citireafvqtqkuxvmail.supabase.co
      - key: SECRET_KEY
        generateValue: true
      - key: TOKEN_TTL_HOURS
        value: "12"
